# Render Blueprint — deploys both services from this repository.
# Docs: https://render.com/docs/blueprint-spec
#
# After connecting the repository to Render, create a Blueprint and provide the
# secret environment variables (MONGO_URI, JWT_SECRET, CLIENT_ORIGIN, VITE_API_URL)
# when asked. A live deployment created from this project is documented in README §1.
services:
  # ---------------------------------------------------------------- API -----
  - type: web
    name: portfolio-blog-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: TRUST_PROXY
        value: "1"

  # ------------------------------------------------------------ SPA site ----
  - type: web
    name: portfolio-blog-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_URL
        sync: false
