# Render Blueprint — deploys the back-end API from this repository.
# Docs: https://render.com/docs/blueprint-spec
#
# After connecting the repository to Render, create a Blueprint and provide the
# secret environment variables (MONGO_URI, JWT_SECRET, CLIENT_ORIGIN) when asked.
services:
  - type: web
    name: portfolio-blog-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: TRUST_PROXY
        value: "1"
